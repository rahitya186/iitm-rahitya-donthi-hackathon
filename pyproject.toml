# Tooling configuration only. The app itself runs with `python src/main.py ...` (see README.md).

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/dashboard.py" = ["E402"]  # the sys.path line has to run before the local imports

[tool.ruff.lint.isort]
known-first-party = ["api", "config", "dashboard", "engine", "evaluate", "ingestion", "main", "nlp", "rebalancer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
